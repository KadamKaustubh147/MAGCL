# MAGCL on RecBole. Protocol = paper §5.1; hyperparameters = paper §5.2 defaults
# (lam1-4 and theta are meant to be swept -- see scripts/tune.py -- these are
# just sane starting points, not the paper's per-dataset optimum).
data_path: ./data/
dataset: ml-1m_preprocessed_byrating

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
load_col:
    inter: [user_id, item_id]

seed: 2020
gpu_id: 0
use_gpu: true
worker: 0

# §5.1: emb 64, batch 4096, Adam, early stop patience 10 on valid Recall@20
embedding_size: 64
train_batch_size: 4096
eval_batch_size: 4096
learning_rate: 0.001
epochs: 300

# Full-sort valid eval measured at 103s/call vs. 36s/train-epoch (74% of epoch
# cost) -- eval_step 5 + stopping_step 2 keeps the SAME 10-epoch patience
# window as the paper (2 checks x 5 epochs = 10), just checked less often, for
# ~2x faster tuning trials. Documented approximation, same spirit as
# normalize_cl below: the "best" checkpoint is now the best of every 5th
# epoch, not a true every-epoch peak. Revert both to 1 / 10 for the final
# multi-seed numbers we actually report.
eval_step: 5
stopping_step: 2

# §5.1: random 8:1:1 split, full-ranking eval, Recall/NDCG @ 10,20,50 (Table 2)
eval_args:
    split: {RS: [0.8, 0.1, 0.1]}
    order: RO
    group_by: user
    mode: full
metrics: [Recall, NDCG]
topk: [10, 20, 50]
valid_metric: recall@20

# RecBole default: 1 uniform negative per positive
train_neg_sample_args:
    distribution: uniform
    sample_num: 1
    dynamic: false

# ---- MAGCL hyperparameters (paper symbols, §4-§5.2) ----
L: 3            # conv layers, best on both datasets (Fig. 5)
tau: 0.1        # temperature (Eq 23-26), best on ML-1M (0.2 on iFashion)
gamma: 1.0      # fusion scale (Eq 14), best on ML-1M (0.4 on iFashion)
alpha: 0.7      # high-order CL weight (Eq 25), best on ML-1M (0.9 on iFashion)
theta: 0.05     # denoising threshold (Eq 8); paper sweeps [0.02, 0.1], no fixed value reported
beta: 0.8       # Jaccard keep threshold (Eq 3); §5.2 states this directly
S: 5            # top-S per row (Eq 3); §5.2 states this directly
lam1: 1.0e-3    # multi-view CL weight (Eq 30)
lam2: 1.0e-4    # cross-layer CL weight (Eq 30)
lam3: 1.0e-4    # uniformity weight (Eq 30)
lam4: 1.0e-4    # L2 reg weight (Eq 30)

# Our one deviation from the literal Eq 23/24/26 text -- see model.py's module
# docstring. false reproduces the paper's raw (unnormalized) inner products.
# Confirmed stable (168 clean epochs, no NaN) and closer to the paper than
# normalize_cl=true (test recall@20 0.2932 vs. paper's 0.3084, ~5% gap,
# vs. ~15-20% gap with normalization) -- now the default.
normalize_cl: false
