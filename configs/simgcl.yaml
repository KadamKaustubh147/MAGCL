# SimGCL (Yu et al., SIGIR 2022) from RecBole-GNN (src/recbole_gnn). Hyperparameters = RecBole-GNN's own tuned ML-1M
# setting (results/general/ml-1m.md); the library's yaml default lambda=0.5 swamps BPR on ML-1M. Shared protocol block.
data_path: ./data/
dataset: ml-1m_preprocessed_byrating

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
load_col:
    inter: [user_id, item_id]

seed: 2020
gpu_id: 0
use_gpu: true
worker: 0

embedding_size: 64
train_batch_size: 4096
# Must exceed n_items (3629) or RecBole floors to 1 user per eval step -- see configs/magcl.yaml.
eval_batch_size: 4096000
epochs: 300
eval_step: 1
stopping_step: 10

eval_args:
    split: {RS: [0.8, 0.1, 0.1]}
    order: RO
    group_by: user
    mode: full
metrics: [Recall, NDCG]
topk: [10, 20, 50]
valid_metric: recall@20

train_neg_sample_args:
    distribution: uniform
    sample_num: 1
    dynamic: false

learning_rate: 0.002
n_layers: 2
reg_weight: 1.0e-4
lambda: 1.0e-5      # CL weight
eps: 0.1            # noise magnitude
temperature: 0.05
